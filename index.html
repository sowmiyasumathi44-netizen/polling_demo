<!DOCTYPE html>
<html>
<head>
    <title>Polling App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
        }

        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        .poll-card {
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .vote-btn {
            width: 70px;
            height: 50px;
            font-size: 20px;
        }

        .question {
            flex: 1;
            font-size: 22px;
        }
    </style>
</head>
<body>

<h1>Live Polling</h1>

<div class="input-box">
    <input type="text" id="questionInput" placeholder="Enter a question">
    <button onclick="addQuestion()">Add</button>
</div>

<div id="questionList"></div>

<script>
function addQuestion() {

    const input = document.getElementById("questionInput");
    const question = input.value.trim();

    if(question === "") {
        alert("Enter a question");
        return;
    }

    const card = document.createElement("div");
    card.className = "poll-card";

    let votes = 0;

    card.innerHTML = `
        <button class="vote-btn">▲ <span>0</span></button>
        <div class="question">${question}</div>
    `;

    const voteButton = card.querySelector(".vote-btn");
    const count = voteButton.querySelector("span");

    voteButton.addEventListener("click", function() {
        votes++;
        count.textContent = votes;
    });

    document.getElementById("questionList").appendChild(card);

    input.value = "";
}
</script>

</body>
</html>
