<!DOCTYPE html>
<html>
<head>
    <title>Polling App</title>
    <style>
        body {
    font-family: Arial, sans-serif;
    max-width: 900px;
    margin: 40px auto;
    background-color: #f4f7fc;
}

h1 {
    text-align: center;
    color: #2c3e50;
}

input {
    padding: 12px;
    font-size: 16px;
    border: 2px solid #3498db;
    border-radius: 8px;
}

button {
    background-color: #3498db;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    cursor: pointer;
}

button:hover {
    background-color: #2980b9;
}

.poll-card {
    background-color: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 20px;
    margin-top: 15px;
    display: flex;
    align-items: center;
    gap: 20px;

    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.vote-btn {
    background-color: #2ecc71;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    width: 90px;
    height: 50px;
    border: none;
    border-radius: 8px;
    font-size: 24px;
}

.vote-btn:hover {
    background-color: #27ae60;
}

.question {
    font-size: 22px;
    color: #34495e;
}
    </style>
</head>
<body>

<h1>Live Polling</h1>
    <head>
    <title>Live Polling</title>

    <style>
        .vote-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;

            width: 100px;
            height: 50px;
            font-size: 24px;
        }
    </style>
</head>

<div class="input-box">
    <input type="text" id="questionInput" placeholder="Enter a question">
    <button onclick="addQuestion()">Add</button>
</div>

<div id="questionList"></div>

<script>
function addQuestion() {

    const input = document.getElementById("questionInput");
    const question = input.value.trim();

    if(question === "") {
        alert("Enter a question");
        return;
    }

    const card = document.createElement("div");
    card.className = "poll-card";

    let votes = 0;

    card.innerHTML = `
        <button class="vote-btn">👍<span>0</span></button>
        <div class="question">${question}</div>
    `;

    const voteButton = card.querySelector(".vote-btn");
    const count = voteButton.querySelector("span");

    voteButton.addEventListener("click", function() {
        votes++;
        count.textContent = votes;
    });

    document.getElementById("questionList").appendChild(card);

    input.value = "";
}
</script>

</body>
</html>
